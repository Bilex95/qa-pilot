[project]
name = "qa-pilot-backend"
version = "0.3.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI dependencies use calls in defaults

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "E741"]
"conftest.py" = ["S101", "S105", "S106"]
"app/seed/**" = ["S311"]
"app/seed/domain_data.py" = ["E501"]  # one bug per line in the data tables

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["app.modules.*.tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["app"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
