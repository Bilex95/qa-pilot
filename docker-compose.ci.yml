# CI override: the frontend runs the production build (next build, standalone server) so no page is compiled on first visit.
# The backend stays as in docker-compose.yml (APP_ENV=development) because the seed CLI refuses to run in production.
# Used by .github/actions/browser-stack through COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml
services:
  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    command: ["node", "server.js"]
    volumes: !reset []
