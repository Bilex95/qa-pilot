<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Pilot prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   QA Pilot design tokens (documented in design/TOKENS.md)
   ========================================================================== */
:root {
  /* Base palette */
  --paper: #F6F7F5;          /* app background, cool off white */
  --surface: #FFFFFF;        /* panels, tables, inputs */
  --surface-sunk: #EEF0ED;   /* table header, sunken areas */
  --ink: #18222F;            /* primary text, sidebar */
  --ink-2: #435061;          /* secondary text */
  --ink-3: #5F6B7A;          /* muted text, meets 4.5:1 on paper */
  --line: #D9DDD8;           /* borders */
  --line-strong: #828B84;    /* input and control borders: 3.51:1 on white, 3.27:1 on paper, 3.07:1 on the grey disabled fill (WCAG 1.4.11) */
  --primary: #0C6B67;        /* instrument teal: primary actions, links, focus */
  --primary-hover: #095753;
  --primary-wash: #E3F1EF;
  --on-primary: #FFFFFF;
  --sidebar: #18222F;
  --sidebar-ink: #C9D2DC;
  --sidebar-active: #253244;

  /* AI suggestion "proof mark" (reserved for AI output only) */
  --ai-wash: #FFF7D6;
  --ai-mark: #F4D35E;
  --ai-line: #9A7400;
  --ai-ink: #4D3A00;

  /* Severity (always paired with a text label) */
  --sev-critical: #B42318; --sev-critical-wash: #FDE8E6;
  --sev-high: #B5400B;     --sev-high-wash: #FDEBDD;
  --sev-medium: #3E5BA9;   --sev-medium-wash: #E6ECFA;
  --sev-low: #4F6B5A;      --sev-low-wash: #E5EFE8;

  /* Feedback */
  --ok: #1E7F4F;  --ok-wash: #E2F3E9;
  --warn: #8A5300; --warn-wash: #FCEFD9;
  --danger: #B42318; --danger-wash: #FDE8E6;
  --info: #2563C9; --info-wash: #E5EEFC;

  /* Test results */
  --res-pass: #1E7F4F; --res-fail: #B42318; --res-blocked: #6B5BB5; --res-skipped: #7C8696; --res-untested: #D5DAD6;

  /* Chart series (validated with the dataviz validator) */
  --series-1: #C2410C; /* opened */
  --series-2: #2563C9; /* closed */
  --chart-bar: #0C6B67;
  --chart-grid: #E6E9E5;

  /* Type */
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 26px; --fs-3xl: 34px;
  --lh-tight: 1.2; --lh-body: 1.5;
  --fw-regular: 400; --fw-bold: 700;

  /* Spacing (4 px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  /* Radius: small for controls, medium for panels, pill for badges */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-pill: 999px;

  /* Elevation: borders do most of the work, shadows only for floating layers */
  --shadow-float: 0 8px 24px rgba(24, 34, 47, 0.16), 0 1px 3px rgba(24, 34, 47, 0.10);
  --shadow-drag: 0 12px 28px rgba(24, 34, 47, 0.22);

  /* Layout */
  --sidebar-w: 232px; --header-h: 56px; --content-max: 1600px;
  --focus: 0 0 0 3px rgba(12, 107, 103, 0.35);
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font-ui); font-size: var(--fs-md); line-height: var(--lh-body); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: var(--lh-tight); font-weight: var(--fw-bold); }
h1 { font-size: var(--fs-2xl); letter-spacing: -0.01em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
p { margin: 0; }
a { color: var(--primary); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--primary-hover); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.92em; font-weight: 500; letter-spacing: 0; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: var(--r-sm); z-index: 100; }
.skip:focus { left: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ==========================================================================
   Controls
   ========================================================================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); height: 36px; padding: 0 var(--sp-4); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: var(--fw-bold); font-size: var(--fs-md); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-sunk); color: var(--ink); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); color: var(--on-primary); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-sunk); }
.btn.sm { height: 30px; padding: 0 var(--sp-3); font-size: var(--fs-sm); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.icon-btn { width: 36px; padding: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-weight: var(--fw-bold); font-size: var(--fs-sm); color: var(--ink); }
.hint { font-size: var(--fs-xs); color: var(--ink-3); }
.input, .select, .textarea { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.textarea { min-height: 96px; resize: vertical; line-height: var(--lh-body); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus); }
.input[disabled], .select[disabled], .textarea[disabled] { background: var(--surface-sunk); color: var(--ink-3); }
.field.invalid .input, .field.invalid .select, .field.invalid .textarea { border-color: var(--danger); }
.err { color: var(--danger); font-size: var(--fs-sm); display: flex; gap: 6px; align-items: flex-start; }
.checkbox { display: inline-flex; gap: var(--sp-2); align-items: center; cursor: pointer; }
.checkbox input { width: 16px; height: 16px; accent-color: var(--primary); }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: var(--r-pill); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--primary); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { box-shadow: var(--focus); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: var(--fw-bold); white-space: nowrap; background: var(--surface-sunk); color: var(--ink-2); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sev-critical { background: var(--sev-critical-wash); color: var(--sev-critical); }
.sev-high { background: var(--sev-high-wash); color: var(--sev-high); }
.sev-medium { background: var(--sev-medium-wash); color: var(--sev-medium); }
.sev-low { background: var(--sev-low-wash); color: var(--sev-low); }
.pri { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 500; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); color: var(--ink-2); background: var(--surface); }
.pri.p1 { border-color: var(--sev-critical); color: var(--sev-critical); }
.st { background: var(--surface-sunk); color: var(--ink-2); }
.st-new { background: #E8ECF2; color: #2F3E52; }
.st-triaged { background: #E9E7F7; color: #44388F; }
.st-in_progress { background: var(--info-wash); color: #1C4E9E; }
.st-fixed { background: var(--primary-wash); color: #095753; }
.st-ready_for_retest { background: #F1E6F7; color: #6A2F86; }
.st-verified { background: var(--ok-wash); color: #17663F; }
.st-closed { background: #ECEEEC; color: #4A5560; }
.st-reopened { background: var(--sev-high-wash); color: #96350A; }
.st-wont_fix { background: transparent; color: var(--ink-3); border: 1px dashed var(--line-strong); }
.ready { background: var(--ok-wash); color: #17663F; }
.at_risk { background: var(--warn-wash); color: var(--warn); }
.blocked { background: var(--danger-wash); color: var(--danger); }
.sla { background: var(--danger-wash); color: var(--danger); }
.label-chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--r-sm); font-size: var(--fs-xs); background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: var(--fs-xs); font-weight: var(--fw-bold); color: #fff; flex: none; }
.who { display: inline-flex; align-items: center; gap: var(--sp-2); }

/* ==========================================================================
   App shell
   ========================================================================== */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
.sidebar { background: var(--sidebar); color: var(--sidebar-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; height: var(--header-h); padding: 0 var(--sp-5); color: #fff; text-decoration: none; font-weight: var(--fw-bold); font-size: var(--fs-lg); }
.brand:hover { color: #fff; }
.brand-mark { width: 26px; height: 26px; }
.nav { padding: var(--sp-2) var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: 2px; }
.nav-group { margin-top: var(--sp-4); padding: 0 var(--sp-2) var(--sp-1); font-size: var(--fs-xs); color: #8D9AAA; }
.nav a { display: flex; align-items: center; gap: var(--sp-3); height: 36px; padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--sidebar-ink); text-decoration: none; font-size: var(--fs-md); }
.nav a svg { width: 18px; height: 18px; opacity: .8; }
.nav a:hover { background: var(--sidebar-active); color: #fff; }
.nav a[aria-current="page"] { background: var(--sidebar-active); color: #fff; box-shadow: inset 3px 0 0 #5FC3BC; }
.nav .count { margin-left: auto; font-size: var(--fs-xs); color: #8D9AAA; }
.sidebar-foot { margin-top: auto; padding: var(--sp-4) var(--sp-5); font-size: var(--fs-xs); color: #8D9AAA; border-top: 1px solid #263345; }
.main { min-width: 0; display: flex; flex-direction: column; }
.header { height: var(--header-h); display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-6); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.org-switch { display: inline-flex; align-items: center; gap: var(--sp-2); height: 36px; padding: 0 var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; font-weight: var(--fw-bold); }
.org-switch .org-badge { width: 22px; height: 22px; border-radius: var(--r-sm); background: var(--primary); color: #fff; display: grid; place-items: center; font-size: var(--fs-xs); flex: none; }
.org-switch .org-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search { position: relative; flex: 1; max-width: 420px; }
.search input { padding-left: 34px; background: var(--paper); }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--ink-3); }
.header-spacer { flex: 1; }
.role-switch { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 3px 4px 3px 10px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-sm); font-size: var(--fs-xs); color: var(--ink-3); }
.role-switch select { border: 0; background: transparent; font-weight: var(--fw-bold); font-size: var(--fs-sm); color: var(--ink); padding: 4px; }
.user-btn { display: inline-flex; align-items: center; gap: var(--sp-2); background: none; border: 0; cursor: pointer; padding: 4px; border-radius: var(--r-sm); }
.menu-toggle { display: none; }
.content { padding: var(--sp-6); max-width: var(--content-max); width: 100%; }
.content.wide { max-width: none; }
.page-head { display: flex; align-items: flex-end; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-5); }
.page-head .grow { flex: 1; min-width: 220px; }
.page-head p { color: var(--ink-3); margin-top: 6px; }
.crumbs { font-size: var(--fs-sm); color: var(--ink-3); margin-bottom: var(--sp-2); }
.crumbs a { color: var(--ink-3); }
.actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.scrim { display: none; }

/* Panels and layout helpers */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.panel-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line); }
.panel-head h2, .panel-head h3 { font-size: var(--fs-lg); flex: 1; }
.panel-body { padding: var(--sp-5); }
.grid { display: grid; gap: var(--sp-4); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp-5); align-items: start; }
.split.left { grid-template-columns: 300px minmax(0, 1fr); }
.split > *, .grid > *, .stack > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.between { justify-content: space-between; }
.divider { height: 1px; background: var(--line); margin: var(--sp-4) 0; }

/* Readout strip: numbers that matter, set like an instrument panel, not cards */
.readout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: var(--sp-5); }
.readout > div { padding: var(--sp-4) var(--sp-5); border-left: 1px solid var(--line); }
.readout > div:first-child { border-left: 0; }
.readout .num { font-size: var(--fs-3xl); font-weight: var(--fw-bold); line-height: 1.1; font-variant-numeric: tabular-nums; }
.readout .cap { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 2px; }
.readout .sub { color: var(--ink-3); font-size: var(--fs-xs); margin-top: 6px; }
.readout .alert .num { color: var(--danger); }

/* Tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.t th { text-align: left; font-size: var(--fs-xs); color: var(--ink-2); font-weight: var(--fw-bold); background: var(--surface-sunk); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover { background: #FAFBFA; }
.t .title-cell a { color: var(--ink); text-decoration: none; font-weight: var(--fw-bold); }
.t .title-cell a:hover { color: var(--primary); text-decoration: underline; }
.t th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.pager { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); font-size: var(--fs-sm); color: var(--ink-3); }
.pager .grow { flex: 1; }

/* Filter bar */
.filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
.filters .input, .filters .select { width: auto; min-width: 140px; height: 34px; min-height: 34px; padding-top: 4px; padding-bottom: 4px; }
.filters .search-f { min-width: 240px; flex: 1; max-width: 340px; }
.filters .search-f::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.views { display: flex; gap: var(--sp-1); align-items: center; padding: var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--line); overflow-x: auto; }
.view-tab { border: 0; background: none; padding: 6px 10px; border-radius: var(--r-sm); font-weight: var(--fw-bold); font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.view-tab[aria-pressed="true"] { background: var(--primary-wash); color: var(--primary-hover); }
.view-tab:hover { background: var(--surface-sunk); }

/* Tabs */
.tabs { display: flex; gap: var(--sp-1); border-bottom: 1px solid var(--line); margin-bottom: var(--sp-4); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 12px; font-weight: var(--fw-bold); color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary); }

/* Definition list (bug fields) */
.dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px var(--sp-3); align-items: center; font-size: var(--fs-md); }
.dl dt { color: var(--ink-3); font-size: var(--fs-sm); }
.dl dd { margin: 0; min-width: 0; }
.dl .select { height: 32px; min-height: 32px; padding: 4px 8px; }

/* Bug detail text blocks */
.prose h3 { font-size: var(--fs-md); margin: var(--sp-5) 0 var(--sp-2); }
.prose h3:first-child { margin-top: 0; }
.prose ol { margin: 0; padding-left: 22px; }
.prose ol li { padding: 2px 0; }
.ea { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.ea > div { border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--sp-3); }
.ea .ea-title { font-size: var(--fs-xs); font-weight: var(--fw-bold); margin-bottom: 4px; }
.ea .exp .ea-title { color: var(--ok); }
.ea .act .ea-title { color: var(--danger); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 26px 1fr; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline .comment-body { margin-top: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--sp-3); white-space: pre-line; }
.event-dot { width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-3); }
.event-dot svg { width: 16px; height: 16px; }

/* Attachments */
.files { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.file { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: var(--fs-sm); background: var(--surface); }
.file svg { width: 16px; height: 16px; color: var(--ink-3); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); padding: var(--sp-4); text-align: center; color: var(--ink-3); font-size: var(--fs-sm); }

/* AI proof mark: the one memorable element */
.suggest { position: relative; border: 1.5px dashed var(--ai-line); background: var(--ai-wash); border-radius: var(--r-md); padding: var(--sp-4); }
.suggest-tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--ai-ink); background: var(--ai-mark); padding: 2px 8px; border-radius: var(--r-sm); margin-bottom: var(--sp-3); }
.suggest-tag svg { width: 14px; height: 14px; }
.suggest mark { background: linear-gradient(transparent 55%, var(--ai-mark) 55%); color: inherit; padding: 0 1px; }
.suggest .reason { color: var(--ai-ink); font-size: var(--fs-sm); margin-top: var(--sp-2); }
.suggest-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }
.ai-panel { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.ai-panel .panel-head { gap: var(--sp-2); }
.ai-panel .panel-head svg { width: 18px; height: 18px; color: var(--ai-line); }
.ai-note { font-size: var(--fs-xs); color: var(--ink-3); }
.dupes { border: 1px solid #E8C98A; background: #FFF9EC; border-radius: var(--r-md); padding: var(--sp-4); }
.dupes h3 { font-size: var(--fs-md); display: flex; gap: var(--sp-2); align-items: center; color: var(--warn); }
.dupe { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-3); align-items: center; padding: var(--sp-2) 0; border-top: 1px solid #F0E0BC; }
.dupe:first-of-type { border-top: 0; }
.score { font-variant-numeric: tabular-nums; font-weight: var(--fw-bold); font-size: var(--fs-sm); color: var(--ink-2); }
.score-bar { width: 64px; height: 6px; border-radius: 3px; background: #F0E0BC; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.score-bar i { display: block; height: 100%; background: var(--warn); }
.thinking { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); border: 1.5px dashed var(--ai-line); border-radius: var(--r-md); background: var(--ai-wash); color: var(--ai-ink); font-size: var(--fs-sm); }
.thinking .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(154,116,0,.18); overflow: hidden; position: relative; }
.thinking .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ai-line); border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }

/* Kanban */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: 272px; gap: var(--sp-3); overflow-x: auto; padding-bottom: var(--sp-3); align-items: start; }
.col { background: var(--surface-sunk); border: 1px solid var(--line); border-radius: var(--r-md); display: flex; flex-direction: column; max-height: calc(100vh - 220px); }
.col-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3); font-weight: var(--fw-bold); font-size: var(--fs-sm); }
.col-head .n { margin-left: auto; color: var(--ink-3); font-weight: var(--fw-regular); }
.col-body { padding: 0 var(--sp-2) var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-2); overflow-y: auto; min-height: 80px; }
.col.drop-ok { outline: 2px solid var(--primary); outline-offset: -2px; background: var(--primary-wash); }
.col.drop-no { outline: 2px dashed var(--danger); outline-offset: -2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; cursor: grab; }
.card:hover { border-color: var(--line-strong); }
.card.dragging { opacity: .5; box-shadow: var(--shadow-drag); }
.card .k { font-size: var(--fs-xs); color: var(--ink-3); }
.card .ttl { font-weight: var(--fw-bold); font-size: var(--fs-sm); margin: 4px 0 8px; line-height: 1.35; }
.card .ttl a { color: var(--ink); text-decoration: none; }
.card .meta { display: flex; align-items: center; gap: 6px; }

.col-empty { font-size: var(--fs-xs); color: var(--ink-3); text-align: center; padding: var(--sp-4) var(--sp-2); }

/* Test runs */
.progress { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--res-untested); gap: 2px; }
.progress i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.case-row { border-bottom: 1px solid var(--line); }
.case-row:last-child { border-bottom: 0; }
.case-head { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); }
.case-head button.expander { background: none; border: 0; text-align: left; cursor: pointer; padding: 0; font-weight: var(--fw-bold); display: flex; gap: var(--sp-2); align-items: center; }
.result-btns { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; }
.result-btns button { border: 0; border-left: 1px solid var(--line-strong); background: var(--surface); padding: 5px 10px; font-size: var(--fs-xs); font-weight: var(--fw-bold); cursor: pointer; color: var(--ink-2); }
.result-btns button:first-child { border-left: 0; }
.result-btns button[aria-pressed="true"].pass { background: var(--res-pass); color: #fff; }
.result-btns button[aria-pressed="true"].fail { background: var(--res-fail); color: #fff; }
.result-btns button[aria-pressed="true"].blocked { background: var(--res-blocked); color: #fff; }
.result-btns button[aria-pressed="true"].skipped { background: var(--res-skipped); color: #fff; }
.case-detail { padding: 0 var(--sp-4) var(--sp-4) 44px; }
.steps-t { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.steps-t td, .steps-t th { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.steps-t th { background: var(--surface-sunk); font-size: var(--fs-xs); }
.steps-t tr.failed td { background: var(--danger-wash); }
.failbox { margin-top: var(--sp-3); border: 1px solid #F2B8B2; background: #FFF6F5; border-radius: var(--r-md); padding: var(--sp-4); }
.res { font-weight: var(--fw-bold); font-size: var(--fs-xs); }
.res-pass { color: var(--res-pass); } .res-fail { color: var(--res-fail); } .res-blocked { color: var(--res-blocked); } .res-skipped { color: var(--res-skipped); } .res-untested { color: var(--ink-3); }

/* Step editor */
.step-ed { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: var(--sp-2); align-items: start; padding: var(--sp-2) 0; border-bottom: 1px solid var(--line); }
.step-ed .n { font-family: var(--font-mono); color: var(--ink-3); padding-top: 8px; text-align: right; }
.step-ed .textarea { min-height: 60px; }
.gen-case { display: grid; grid-template-columns: 22px 1fr; gap: var(--sp-3); padding: var(--sp-3) 0; border-top: 1px dashed rgba(154,116,0,.4); }
.gen-case:first-of-type { border-top: 0; }
.type-tag { font-size: var(--fs-xs); font-weight: var(--fw-bold); padding: 1px 6px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line-strong); }

/* Suite list */
.suite-list { list-style: none; margin: 0; padding: var(--sp-2); }
.suite-list li a { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink); }
.suite-list li a:hover { background: var(--surface-sunk); }
.suite-list li a[aria-current="true"] { background: var(--primary-wash); }
.suite-list .proj { padding: var(--sp-3) 12px var(--sp-1); font-size: var(--fs-xs); color: var(--ink-3); }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-ui); fill: var(--ink-2); font-size: 12px; }
.chart .axis { stroke: var(--line-strong); }
.chart .grid-l { stroke: var(--chart-grid); }
.chart [data-tip] { cursor: default; }
.hbars { display: flex; flex-direction: column; gap: 10px; }

#tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; padding: 6px 10px; border-radius: var(--r-sm); font-size: var(--fs-xs); z-index: 200; display: none; max-width: 240px; box-shadow: var(--shadow-float); }

/* States */
.state-box { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-3); padding: var(--sp-12) var(--sp-6); }

.err-code { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
.sk { background: linear-gradient(90deg, #E8EBE7 0%, #F2F4F1 50%, #E8EBE7 100%); background-size: 200% 100%; border-radius: var(--r-sm); animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Auth */
.auth { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); min-height: 100vh; }

.auth-main { display: flex; align-items: center; justify-content: center; padding: var(--sp-10) var(--sp-6); }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h2 { font-size: var(--fs-2xl); margin-bottom: 6px; }
.auth-card form { display: flex; flex-direction: column; gap: var(--sp-4); margin-top: var(--sp-6); }
.banner { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm); font-size: var(--fs-sm); }

.banner.info { background: var(--info-wash); color: #1C4E9E; }
.banner.warn { background: var(--warn-wash); color: #6B4100; }
.banner.ok { background: var(--ok-wash); color: #17663F; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Dialog, toast, menus */
.modal-back { position: fixed; inset: 0; background: rgba(24,34,47,.45); display: grid; place-items: center; z-index: 90; padding: var(--sp-4); }
.modal { background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 520px; box-shadow: var(--shadow-float); max-height: calc(100vh - 32px); overflow: auto; }
.modal-head { display: flex; align-items: center; padding: var(--sp-5) var(--sp-5) 0; }
.modal-head h2 { flex: 1; font-size: var(--fs-xl); }
.modal-body { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); }

.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r-sm); box-shadow: var(--shadow-float); font-size: var(--fs-sm); display: flex; gap: 10px; align-items: center; max-width: 92vw; }
.toast.error { background: #7E1810; }
.menu { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-float); padding: 4px; min-width: 200px; max-width: min(320px, calc(100vw - 16px)); z-index: 60; overflow-wrap: anywhere; }
.menu button, .menu a { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; border: 0; background: none; text-align: left; border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm); color: var(--ink); text-decoration: none; }
.menu button:hover, .menu a:hover { background: var(--surface-sunk); }
.menu button[disabled] { color: var(--ink-3); cursor: not-allowed; }
.menu .menu-label { font-size: var(--fs-xs); color: var(--ink-3); padding: 6px 10px 2px; }

/* Prototype dev toolbar (not part of the product) */
.devbar { position: fixed; right: 16px; bottom: 16px; z-index: 120; background: #fff; border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); box-shadow: var(--shadow-float); padding: 8px 10px; display: flex; gap: 10px; align-items: center; font-size: var(--fs-xs); color: var(--ink-3); }
.devbar select { font-size: var(--fs-xs); padding: 3px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: #fff; }

   Responsive

@media (max-width: 1180px) {

  .step-ed { grid-template-columns: 24px 1fr auto; }

  .case-detail { padding-left: var(--sp-4); }
  .case-head { grid-template-columns: 1fr; }
  .devbar { left: 8px; right: 8px; bottom: 8px; flex-wrap: wrap; }

const passRate = runs => { let p = 0, t = 0; runs.forEach(r => { const c = runCounts(r); p += c.pass; t += c.pass + c.fail + c.blocked; }); return t ? Math.round(100 * p / t) : null; };

function readiness(rel) {
  const bugs = BUGS.filter(b => b.release === rel.id && OPEN(b.status));
  const runs = RUNS.filter(r => r.release === rel.id);
  const crit = bugs.filter(b => b.sev === 'critical').length, high = bugs.filter(b => b.sev === 'high').length;
  const rate = passRate(runs), inProg = runs.filter(r => r.status === 'in_progress').length;
  const reasons = [];
  let status = 'ready';
  if (crit) reasons.push(`${crit} open Critical bug${crit > 1 ? 's' : ''}`);
  if (rate !== null && rate < 80) reasons.push(`Pass rate ${rate}% is below 80%`);
  if (reasons.length) status = 'blocked';
  const risk = [];
  if (high) risk.push(`${high} open High bug${high > 1 ? 's' : ''}`);
  if (rate !== null && rate >= 80 && rate < 95) risk.push(`Pass rate ${rate}% is below 95%`);
  if (inProg) risk.push(`${inProg} run${inProg > 1 ? 's' : ''} still in progress`);
  if (!runs.length) risk.push('No test runs linked');
  if (status === 'ready' && risk.length) status = 'at_risk';
  reasons.push(...risk);
  if (!reasons.length) reasons.push(`No open Critical or High bugs, pass rate ${rate}%`);
  return { status, reasons, rate, open: bugs.length, runs };

/* ==========================================================================

   validated pair --series-1 / --series-2 with a legend and direct labels.

function hbars(rows, max) {
  max = max || Math.max(1, ...rows.map(r => r.v));
  return `<div class="hbars">${rows.map(r => `<div class="hbar" data-tip="${esc(r.label)}: ${r.v}"><span>${r.labelHtml || esc(r.label)}</span><div class="track"><div class="fill" style="width:${100 * r.v / max}%"></div></div><span class="v">${r.v}</span></div>`).join('')}</div>`;
}
function trendSeries(days = 30) {
  const opened = [], closed = [];
  for (let i = days - 1; i >= 0; i--) {
    const seed = (i * 37 + 11) % 7;
    opened.push(Math.max(0, Math.round(3 + 2 * Math.sin(i / 3) + seed / 3)));
    closed.push(Math.max(0, Math.round(2.6 + 2 * Math.cos(i / 4) + ((i * 13) % 5) / 3)));
  }
  return { opened, closed };
}
function lineChart({ opened, closed }, w = 640, hgt = 220) {
  const pad = { l: 32, r: 76, t: 12, b: 28 };
  const n = opened.length, max = Math.max(...opened, ...closed) + 1;
  const x = i => pad.l + i * (w - pad.l - pad.r) / (n - 1);
  const y = v => pad.t + (hgt - pad.t - pad.b) * (1 - v / max);
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = [0, Math.round(max / 2), max];
  const day = i => { const d = new Date(NOW); d.setDate(d.getDate() - (n - 1 - i)); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  const hits = opened.map((v, i) => `<rect x="${x(i) - 8}" y="${pad.t}" width="16" height="${hgt - pad.t - pad.b}" fill="transparent" data-tip="${day(i)}: ${v} opened, ${closed[i]} closed"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Bugs opened and closed per day, last ${n} days">
    ${ticks.map(t => `<line class="grid-l" x1="${pad.l}" x2="${w - pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${[0, Math.floor(n / 2), n - 1].map(i => `<text x="${x(i)}" y="${hgt - 8}" text-anchor="middle">${day(i)}</text>`).join('')}
    <path d="${path(opened)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path(closed)}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 3"/>
    <circle cx="${x(n - 1)}" cy="${y(opened[n - 1])}" r="4" fill="var(--series-1)" stroke="#fff" stroke-width="2"/>
    <circle cx="${x(n - 1)}" cy="${y(closed[n - 1])}" r="4" fill="var(--series-2)" stroke="#fff" stroke-width="2"/>
    <text x="${x(n - 1) + 10}" y="${y(opened[n - 1]) + 4}">Opened ${opened[n - 1]}</text>
    <text x="${x(n - 1) + 10}" y="${y(closed[n - 1]) + (Math.abs(y(closed[n - 1]) - y(opened[n - 1])) < 14 ? 18 : 4)}">Closed ${closed[n - 1]}</text>
    ${hits}
  </svg>`;
}

  const pad = { l: 32, r: 8, t: 16, b: 30 }; const max = 100;
  const bw = (w - pad.l - pad.r) / rows.length;

const VIEWS = [['all', 'All open'], ['mine', 'Assigned to me'], ['critical-prod', 'Critical in prod'], ['retest', 'Ready for retest'], ['sla', 'Past SLA']];
function filteredBugs() {
  let list = BUGS.slice();
  if (F.view === 'all') list = list.filter(b => OPEN(b.status));
  if (F.view === 'mine') list = list.filter(b => b.assignee === me() && OPEN(b.status));
  if (F.view === 'critical-prod') list = list.filter(b => b.sev === 'critical' && b.env === 'prod' && OPEN(b.status));
  if (F.view === 'retest') list = list.filter(b => b.status === 'ready_for_retest');
  if (F.view === 'sla') list = list.filter(slaBreached);
  if (F.q) { const q = F.q.toLowerCase(); list = list.filter(b => b.key.toLowerCase().includes(q) || b.title.toLowerCase().includes(q)); }
  if (F.project) list = list.filter(b => b.project.id === F.project);
  if (F.status) list = list.filter(b => b.status === F.status);
  if (F.sev) list = list.filter(b => b.sev === F.sev);
  if (F.assignee) list = list.filter(b => F.assignee === 'none' ? !b.assignee : b.assignee === F.assignee);
  const sevRank = { critical: 0, high: 1, medium: 2, low: 3 };
  if (F.sort === 'updated') list.sort((a, b) => a.h - b.h);
  if (F.sort === 'severity') list.sort((a, b) => sevRank[a.sev] - sevRank[b.sev] || a.h - b.h);
  if (F.sort === 'priority') list.sort((a, b) => a.pri.localeCompare(b.pri) || a.h - b.h);
  return list;
}

}

function scrRuns() {
  const head = pageHead('Test runs', 'Execute cases against an environment and track results.', can('test.manage') ? `<button class="btn primary" data-action="new-run">${ic.plus}New test run</button>` : '');
  const g = stateGate('table', 'test runs'); if (g) return head + g;
  if (S.state === 'empty') return head + emptyBox(ic.run, 'No test runs yet', 'Start a run from one or more suites. Each run keeps a snapshot of the cases so results stay accurate.', can('test.manage') ? `<button class="btn primary" data-action="new-run">${ic.plus}New test run</button>` : '');
  return head + `<div class="panel"><div class="filters"><div class="legend">${['pass', 'fail', 'blocked', 'skipped', 'untested'].map(k => `<span><i style="background:var(--res-${k})"></i>${k[0].toUpperCase() + k.slice(1)}</span>`).join('')}</div></div>
    <div class="table-wrap"><table class="t stackable"><thead><tr><th>Run</th><th>Status</th><th>Environment</th><th>Release</th><th style="width:24%">Progress</th><th>Pass rate</th><th>Started</th></tr></thead><tbody>
    ${RUNS.map(r => { const c = runCounts(r); const rel = RELEASES.find(x => x.id === r.release); return `<tr><td class="title-cell"><a href="${o('/runs/' + r.id)}">${esc(r.name)}</a><div class="xs muted mono">${r.id}</div></td><td data-label="Status"><span class="badge ${r.status === 'completed' ? 'st-verified' : 'st-in_progress'}">${r.status === 'completed' ? 'Completed' : 'In progress'}</span></td><td data-label="Environment"><span class="mono small">${r.env}</span></td><td data-label="Release">${rel ? esc(rel.name) : '<span class="muted">None</span>'}</td><td data-label="Progress">${progressBar(c)}<div class="xs muted" style="margin-top:4px">${c.pass + c.fail + c.blocked + c.skipped} of ${Object.keys(r.results).length} executed</div></td><td data-label="Pass rate"><b>${passRate([r])}%</b></td><td data-label="Started" class="small">${ago(r.started)} by ${esc(user(r.by).name.split(' ')[0])}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}
function scrRun(id) {
  const r = RUNS.find(x => x.id === id); if (!r) return scrNotFound();
  const failedState = S.state === 'failed';
  const results = { ...r.results };
  if (failedState) results['TC-114'] = 'untested';
  const c = { pass: 0, fail: 0, blocked: 0, skipped: 0, untested: 0 }; Object.values(results).forEach(x => c[x]++);
  const canRun = can('test.manage') && r.status === 'in_progress';
  const head = pageHead(esc(r.name), `${r.status === 'completed' ? 'Completed' : 'In progress'} on <span class="mono">${r.env}</span>. ${RELEASES.find(x => x.id === r.release) ? 'Linked to ' + esc(RELEASES.find(x => x.id === r.release).name) + '.' : ''}`, canRun ? `<button class="btn" data-action="toast" data-msg="Run completed. Results are now read only.">Complete run</button>` : '', `<a href="${o('/runs')}">Test runs</a> / <span class="mono">${r.id}</span>`);
  const g = stateGate('detail', 'this run'); if (g) return head + g;
  const caseIds = Object.keys(results);
  const expanded = failedState ? 'TC-103' : (tabState.run || 'TC-103');
  return head + `<section class="readout" aria-label="Run progress">
      <div><div class="num">${passRate([{ results }])}%</div><div class="cap">Pass rate</div></div>
      <div><div class="num">${c.pass}</div><div class="cap">Pass</div></div>
      <div class="${c.fail ? 'alert' : ''}"><div class="num">${c.fail}</div><div class="cap">Fail</div></div>
      <div><div class="num">${c.untested}</div><div class="cap">Not run yet</div><div class="sub">${c.blocked} blocked, ${c.skipped} skipped</div></div></section>
    <div style="margin-bottom:16px">${progressBar(c)}</div>
    <section class="panel">${caseIds.map(cid => { const cs = CASES.find(x => x.id === cid); const res = results[cid]; const open = cid === expanded;
      const failedStep = cid === 'TC-103' ? 2 : cid === 'TC-104' ? 1 : -1;
      return `<div class="case-row"><div class="case-head"><button class="expander" data-action="expand-case" data-id="${cid}" aria-expanded="${open}">${(open ? ic.chev : ic.chevr).replace('<svg', '<svg width="16" height="16"')}<span class="mono muted small">${cid}</span><span>${esc(cs.title)}</span></button>
        <div class="row" style="gap:8px"><span class="res res-${res}">${res === 'untested' ? 'Not run' : res[0].toUpperCase() + res.slice(1)}</span>${canRun ? `<div class="result-btns" role="group" aria-label="Result for ${cid}">${['pass', 'fail', 'blocked', 'skipped'].map(k => `<button class="${k}" aria-pressed="${res === k}" data-action="set-result" data-id="${cid}" data-res="${k}">${k === 'skipped' ? 'Skip' : k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>` : ''}</div></div>
        ${open ? `<div class="case-detail">${cs.pre ? `<p class="small muted" style="margin-bottom:8px"><b>Preconditions:</b> ${esc(cs.pre)}</p>` : ''}
          <div class="table-wrap"><table class="steps-t"><thead><tr><th style="width:36px">#</th><th>Action</th><th>Expected result</th></tr></thead><tbody>${cs.steps.map((s, i) => `<tr class="${res === 'fail' && i === failedStep ? 'failed' : ''}"><td class="mono">${i + 1}</td><td>${esc(s.a)}</td><td>${esc(s.e)}${res === 'fail' && i === failedStep ? `<div class="err" style="margin-top:4px">Failed at this step</div>` : ''}</td></tr>`).join('')}</tbody></table></div>
          ${res === 'fail' ? `<div class="failbox stack"><div class="grid g2"><div class="field"><label for="fs-${cid}">Failed at step</label><select class="select" id="fs-${cid}" ${canRun ? '' : 'disabled'}>${cs.steps.map((s, i) => `<option ${i === failedStep ? 'selected' : ''}>Step ${i + 1}</option>`).join('')}</select></div><div class="field"><label for="fa-${cid}">Actual result</label><input class="input" id="fa-${cid}" value="Total went up by 4.20 and SAVE10 disappeared" ${canRun ? '' : 'disabled'}></div></div>
            ${cid === 'TC-104' ? `<p class="small">Linked bug: <a href="${o('/bugs/WEB-137')}" class="mono">WEB-137</a></p>` : can('test.manage') ? `<div class="row"><a class="btn primary" href="${o('/bugs/new?from=run')}">${ic.bug}Create bug from failed step</a><span class="small muted">Prefills title, steps up to step ${failedStep + 1}, expected and actual results, environment and component.</span></div>` : ''}</div>` : ''}
        </div>` : ''}</div>`; }).join('')}</section>`;
}

    c.addEventListener('dragstart', ev => { dragKey = c.dataset.key; c.classList.add('dragging'); ev.dataTransfer.setData('text/plain', dragKey); ev.dataTransfer.effectAllowed = 'move';
      const ok = allowedTargets(BUGS.find(x => x.key === dragKey)); document.querySelectorAll('.col').forEach(col => col.dataset.ok = ok.includes(col.dataset.col) ? '1' : '0'); });
    c.addEventListener('dragend', () => { c.classList.remove('dragging'); document.querySelectorAll('.col').forEach(col => col.classList.remove('drop-ok', 'drop-no')); });
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.toggle('drop-ok', col.dataset.ok === '1'); col.classList.toggle('drop-no', col.dataset.ok !== '1'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop-ok', 'drop-no'));
    col.addEventListener('drop', ev => { ev.preventDefault(); const b = BUGS.find(x => x.key === dragKey); if (b && b.status !== col.dataset.col && moveBug(dragKey, col.dataset.col)) render(); else document.querySelectorAll('.col').forEach(x => x.classList.remove('drop-ok', 'drop-no')); });
  });
}
window.addEventListener('hashchange', render);
render();
</script>
