name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A stage branch push does not cancel the previous run: the full layout check takes about 50 minutes and its result is the evidence
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/stage/') }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No .env files committed
        run: |
          if git log --all --name-only --pretty=format: | sort -u | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "An env file is committed"; exit 1
          fi
      - name: No secret patterns in history
        run: |
          PATTERN='sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[abpr]-[A-Za-z0-9-]{10,}'
          set +e
          git grep -lIE "$PATTERN" $(git rev-list --all) -- . ':!*package-lock.json'
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "Secret pattern found"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "Scan failed ($rc)"; exit 1; fi
          echo "No secret patterns"

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qapilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qapilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qapilot -d qapilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://qapilot:ci-only-password@localhost:5432/qapilot_test
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: globals.css matches the locked prototype
        working-directory: .
        run: python3 scripts/build_globals_css.py --check
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  contract:
    name: OpenAPI contract up to date
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Export OpenAPI from the backend
        working-directory: backend
        run: python -m app.openapi_export > ../frontend/openapi.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run api:types
      - name: Committed contract matches the code
        run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.d.ts

  newman:
    name: Newman smoke (compose, migrate, seed)
    runs-on: ubuntu-24.04
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          PW="Ci$(openssl rand -hex 6)9"
          echo "::add-mask::${PW}"
          echo "SEED_PW=${PW}" >> "$GITHUB_ENV"
      - name: Set seed password
        run: sed -i "s|^SEED_USER_PASSWORD=.*|SEED_USER_PASSWORD=${SEED_PW}|" .env
      - name: Start db and backend (migrations run on start)
        run: docker compose up -d --build --wait db backend
      - name: Seed baseline twice (idempotent)
        run: |
          docker compose exec -T backend python -m app.seed --scenario baseline
          docker compose exec -T backend python -m app.seed --scenario baseline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Newman
        run: npx --yes newman@6.2.3 run postman/qa-pilot.postman_collection.json -e postman/local.postman_environment.json --working-dir postman --env-var "password=${SEED_PW}"
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v

  responsive:
    name: Responsive and popup checks (360 to 2560 px, 200% zoom)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          PW="Ci$(openssl rand -hex 6)9"
          echo "::add-mask::${PW}"
          sed -i "s|^SEED_USER_PASSWORD=.*|SEED_USER_PASSWORD=${PW}|" .env
          echo "SEED_USER_PASSWORD=${PW}" >> "$GITHUB_ENV"
      - name: Start the full stack
        run: docker compose up -d --build --wait
      - name: Seed baseline
        run: docker compose exec -T backend python -m app.seed --scenario baseline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Warm up the dev server (the first compile of a route can take minutes on a cold runner)
        run: |
          for p in /login /register /o/lumen/dashboard /o/lumen/bugs /o/lumen/bugs/new /o/lumen/bugs/WEB-1 /o/lumen/board /o/lumen/tests /o/lumen/runs /o/lumen/runs/R-1 /o/lumen/releases /o/lumen/releases/00000000-0000-4000-8000-000000000000 /o/lumen/reports /o/lumen/tests/cases/new /o/lumen/settings /o/lumen/members; do
            curl -s -o /dev/null --max-time 300 "http://localhost:3000$p" || echo "warm up of $p did not finish"
          done
      - name: Browser login smoke
        working-directory: e2e
        run: node scripts/smoke-login.mjs
      - name: Sign out from every signed in page
        working-directory: e2e
        run: node scripts/check-signout.mjs
      - name: Responsive and popup checks (full layout check)
        working-directory: e2e
        run: node scripts/check-app-layout.mjs --shots ci-layout-shots --batch 3 2>&1 | tee layout-result.txt; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Screen flows
        working-directory: e2e
        run: |
          for f in check-bugs-flow check-tests-flow check-board-flow check-bug-detail-flow check-runs-flow check-releases-flow check-dashboard-flow check-settings-flow check-members-flow check-reset-flow; do
            echo "== $f"; node "scripts/$f.mjs" || exit 1
          done
        shell: bash
      - name: Parity capture (real screens next to the locked screenshots)
        if: always()
        working-directory: e2e
        run: |
          for f in capture-bugs-parity capture-tests-parity capture-members-parity capture-settings-parity capture-board-parity capture-bug-detail-parity capture-runs-parity capture-releases-parity capture-dashboard-parity; do
            echo "== $f"; node "scripts/$f.mjs" || true
          done
        shell: bash
      - name: Layout screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: |
            e2e/ci-layout-shots
            e2e/layout-result.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Parity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-screenshots
          path: e2e/parity
          if-no-files-found: ignore
          retention-days: 30
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend frontend
      - name: Stop
        if: always()
        run: docker compose down -v
