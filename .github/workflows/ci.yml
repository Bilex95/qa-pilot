name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A stage branch push does not cancel the previous run: the full layout check takes about 50 minutes and its result is the evidence
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/stage/') }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: No .env files committed
        run: |
          if git log --all --name-only --pretty=format: | sort -u | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "An env file is committed"; exit 1
          fi
      - name: No secret patterns in history
        run: |
          PATTERN='sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[abpr]-[A-Za-z0-9-]{10,}'
          set +e
          git grep -lIE "$PATTERN" $(git rev-list --all) -- . ':!*package-lock.json'
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "Secret pattern found"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "Scan failed ($rc)"; exit 1; fi
          echo "No secret patterns"

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qapilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qapilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qapilot -d qapilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://qapilot:ci-only-password@localhost:5432/qapilot_test
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: globals.css matches the locked prototype
        working-directory: .
        run: python3 scripts/build_globals_css.py --check
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  contract:
    name: OpenAPI contract up to date
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Export OpenAPI from the backend
        working-directory: backend
        run: python -m app.openapi_export > ../frontend/openapi.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run api:types
      - name: Committed contract matches the code
        run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.d.ts

  newman:
    name: Newman smoke (compose, migrate, seed)
    runs-on: ubuntu-24.04
    needs: [backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create .env with throwaway secrets
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          PW="Ci$(openssl rand -hex 6)9"
          echo "::add-mask::${PW}"
          echo "SEED_PW=${PW}" >> "$GITHUB_ENV"
      - name: Set seed password
        run: sed -i "s|^SEED_USER_PASSWORD=.*|SEED_USER_PASSWORD=${SEED_PW}|" .env
      - name: Start db and backend (migrations run on start)
        run: docker compose up -d --build --wait db backend
      - name: Seed baseline twice (idempotent)
        run: |
          docker compose exec -T backend python -m app.seed --scenario baseline
          docker compose exec -T backend python -m app.seed --scenario baseline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Newman
        run: npx --yes newman@6.2.3 run postman/qa-pilot.postman_collection.json -e postman/local.postman_environment.json --working-dir postman --env-var "password=${SEED_PW}"
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v

  # The browser checks run as parallel jobs, each with its own runner and database (D-060, D-068): the layout check in five shards of
  # widths, the screen flows in three groups, the parity capture on its own. A failure shows up as soon as its shard finishes.
  layout:
    name: Layout (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "360 and 390 px", widths: "360,390" }
          - { name: "768 and 1024 px", widths: "768,1024" }
          - { name: "1280 and 1440 px", widths: "1280,1440" }
          - { name: "1920 and 2560 px", widths: "1920,2560" }
          - { name: "200% zoom", widths: "1280-zoom200,1920-zoom200" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-stack
      - name: Layout check of these widths
        working-directory: e2e
        run: node scripts/check-app-layout.mjs --shots ci-layout-shots --batch 2 --only "${{ matrix.widths }}" 2>&1 | tee layout-result.txt; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Layout screenshots and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layout-screenshots-${{ matrix.name }}
          path: |
            e2e/ci-layout-shots
            e2e/layout-result.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend frontend

  flows:
    name: Screen flows (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sign in, bugs, tests, board
            scripts: smoke-login check-signout check-bugs-flow check-tests-flow check-board-flow
          - name: bug detail, projects, runs, releases
            scripts: check-bug-detail-flow check-projects-flow check-ai-flow check-runs-flow check-releases-flow
          - name: dashboard, settings, members, reset, axe
            scripts: check-dashboard-flow check-settings-flow check-members-flow check-reset-flow check-app-axe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-stack
      - name: Run the scripts
        working-directory: e2e
        run: |
          failed=""
          for f in ${{ matrix.scripts }}; do
            echo "== $f"; node "scripts/$f.mjs" || failed="$failed $f"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
        shell: bash
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend frontend

  parity:
    name: Parity capture (real screens next to the locked screenshots)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-stack
      - name: Capture
        working-directory: e2e
        run: |
          for f in capture-bugs-parity capture-tests-parity capture-members-parity capture-settings-parity capture-board-parity capture-bug-detail-parity capture-runs-parity capture-releases-parity capture-dashboard-parity capture-projects-parity capture-ai-parity capture-triage-parity; do
            echo "== $f"; node "scripts/$f.mjs" || true
          done
        shell: bash
      - name: Parity screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-screenshots
          path: e2e/parity
          if-no-files-found: ignore
          retention-days: 30
