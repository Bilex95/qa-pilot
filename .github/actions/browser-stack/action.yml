name: Browser stack
description: >
  The full stack with the baseline seed, Node, Playwright and a warmed up dev server, for the browser jobs of CI (layout shards, screen flows,
  parity). Every job has its own runner and its own database, so the shards never share fixtures.
runs:
  using: composite
  steps:
    - name: Create .env with throwaway secrets
      shell: bash
      run: |
        cp .env.example .env
        sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
        sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
        PW="Ci$(openssl rand -hex 6)9"
        echo "::add-mask::${PW}"
        sed -i "s|^SEED_USER_PASSWORD=.*|SEED_USER_PASSWORD=${PW}|" .env
        echo "SEED_USER_PASSWORD=${PW}" >> "$GITHUB_ENV"
    - name: Start the full stack (frontend as the production build, not next dev)
      shell: bash
      run: |
        echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml" >> "$GITHUB_ENV"
        COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml docker compose up -d --build --wait
    - name: Seed baseline
      shell: bash
      run: docker compose exec -T backend python -m app.seed --scenario baseline
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: e2e/package-lock.json
    - name: Install Playwright
      shell: bash
      working-directory: e2e
      run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
    - name: Time of the first request per route (production build, no warm up; measured, not waited for)
      shell: bash
      run: |
        for p in /login /o/lumen/dashboard /o/lumen/projects /o/lumen/bugs; do
          curl -s -o /dev/null --max-time 120 -w "first request $p: %{time_total}s (HTTP %{http_code})\n" "http://localhost:3000$p" || echo "first request of $p did not finish"
        done
