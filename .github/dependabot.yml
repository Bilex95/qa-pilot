version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # BL-045: the types must match the Node we run (22, in frontend/Dockerfile and CI). Move this when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # BL-044: openapi-typescript requires TypeScript 5 (peer typescript ^5.x). Remove this when it supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/browser-stack
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
